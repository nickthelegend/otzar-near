[package]
name = "hako-test-usdc"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "tUSDC (Hako test): a NEP-141 test token for Hako covered-call premiums on NEAR testnet. No value."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.0-rc.1"
near-contract-standards = "=5.30.0-rc.1"

[dev-dependencies]
near-sdk = { version = "=5.30.0-rc.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
